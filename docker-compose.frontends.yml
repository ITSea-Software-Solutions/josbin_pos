# Static web frontends served behind the backend stack.
# Each is a tiny nginx that serves the built SPA and proxies /api + /broadcasting
# to the Laravel backend (service name: nginx) on the shared internal network.
services:
  dashboard-web:
    image: nginx:1.25-alpine
    container_name: josbin_dashboard_web
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - ./docker/frontends/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - josbin_pos_internal
    depends_on:
      - nginx

  # HTTPS (self-signed) variant of the dashboard on :8443. Serves the SAME
  # built dist as dashboard-web — a SEPARATE container so the plain-HTTP
  # dashboard (:8090) is never at risk if TLS/config has an issue. Enables
  # secure-context browser features (camera barcode scanner). The cert lives
  # in ./docker/frontends/certs (git-ignored, generated on the host).
  dashboard-tls:
    image: nginx:1.25-alpine
    container_name: josbin_dashboard_tls
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - ./docker/frontends/dashboard-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/frontends/certs:/etc/nginx/certs:ro
    networks:
      - josbin_pos_internal
    depends_on:
      - nginx

  pos-web:
    image: nginx:1.25-alpine
    container_name: josbin_pos_web
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/frontends/pos.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - josbin_pos_internal
    depends_on:
      - nginx

  # Static docs: VitePress manual (user_manual / dashboard_manual / dev docs)
  # plus flows.html + architecture.html. Served at :8095. The in-app Help
  # drawer's "Open full guide" links and the login-screen doc links point here
  # (VITE_DOCS_URL). Pure static — no backend proxy.
  docs-web:
    image: nginx:1.25-alpine
    container_name: josbin_docs_web
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./docs-site/.vitepress/dist:/usr/share/nginx/html:ro
      - ./docker/frontends/docs.conf:/etc/nginx/conf.d/default.conf:ro
      # Password-protected internal docs (built by scripts/build-internal-docs.mjs)
      - ./internal-docs-dist:/usr/share/nginx/internal:ro
      - ./docker/frontends/internal.htpasswd:/etc/nginx/internal.htpasswd:ro
      # Installer downloads — persistent dir on the host, populated out of band
      # (rsync the .exe there); NOT in git, survives doc redeploys.
      - ./downloads:/usr/share/nginx/downloads:ro
    networks:
      - josbin_pos_internal
