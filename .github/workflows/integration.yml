name: Integration smoke

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'scripts/smoke-test-demo.sh'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'scripts/smoke-test-demo.sh'
  workflow_dispatch:

jobs:
  smoke:
    name: End-to-end smoke against demo stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend env (fresh checkout has no .env — it is gitignored)
        run: cp backend/.env.example backend/.env

      - name: Hand the bind mounts to the container user
        # The PHP containers run as uid 1000 (surapos); the runner's checkout
        # is uid 1001. The image chowns /var/www/html but the bind mount
        # shadows that — without this, composer cannot create vendor/ and
        # Laravel cannot write storage/logs (same failure the first droplet
        # install hit).
        # Repo-root storage/ (the ./storage/logs mount) is untracked — a fresh
        # checkout doesn't have it; docker would create it root-owned.
        run: |
          mkdir -p storage/logs
          sudo chown -R 1000:1000 backend storage
        # .env.example is docker-native (DB_HOST=postgres, redis defaults) and
        # the demo overlay's container env overrides DB_DATABASE. APP_KEY is
        # generated below once vendor exists.

      - name: Install backend dependencies
        # vendor/ is bind-mounted into every PHP container; without it the
        # horizon/reverb/scheduler workers crash-loop and `up --wait` fails on
        # their healthchecks — this workflow could never pass without this
        # step. `compose run` boots postgres/redis/pgbouncer (depends_on)
        # first, which also runs init.sql on the fresh data dir (extensions).
        run: |
          docker compose -p josbin_demo -f docker-compose.yml -f docker-compose.demo.yml \
            run --rm app composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate APP_KEY
        run: |
          docker compose -p josbin_demo -f docker-compose.yml -f docker-compose.demo.yml \
            run --rm app php artisan key:generate --force

      - name: Boot demo stack
        run: |
          docker compose -p josbin_demo -f docker-compose.yml -f docker-compose.demo.yml up -d --wait
          # `--wait` blocks on healthchecks; if app/nginx aren't healthy in
          # 60s they fail the step instead of letting smoke time out later.

      - name: Wait for /api/health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/api/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "API never returned 200"; docker compose -p josbin_demo logs nginx app | tail -50; exit 1

      - name: Run migrations + demo seeders
        run: |
          docker compose -p josbin_demo exec -T app php artisan migrate --force
          docker compose -p josbin_demo exec -T app php artisan db:seed --class=DatabaseSeeder --force
          docker compose -p josbin_demo exec -T app php artisan db:seed --class=DemoSeeder --force

      - name: Smoke test
        run: bash scripts/smoke-test-demo.sh

      - name: Tail laravel.log on failure
        if: failure()
        run: docker compose -p josbin_demo exec -T app sh -c 'cat storage/logs/laravel.log | tail -200' || true

      - name: Bring down
        if: always()
        run: docker compose -p josbin_demo down -v
