name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Laravel PHPUnit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: josbin_pos_test
          POSTGRES_USER: josbin_pos
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, redis, bcmath, mbstring, zip, intl, pcntl
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Alias "postgres" to the CI service
        # phpunit.xml force-pins DB_HOST=postgres (deliberately — it must beat
        # the demo container's env). Patching config files here would fight
        # that contract; giving the runner a "postgres" hostname satisfies it.
        # (The old sed of .env.testing was overridden by the force pin — the
        # reason this workflow never got past its first DB test.)
        run: echo "127.0.0.1 postgres" | sudo tee -a /etc/hosts

      - name: Enable postgres extensions (what init.sql provisions in real stacks)
        run: psql -h 127.0.0.1 -U josbin_pos -d josbin_pos_test -c "CREATE EXTENSION IF NOT EXISTS vector;" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: secret

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --env=testing --no-interaction
        env:
          APP_ENV: testing

      - name: Run PHPUnit tests
        working-directory: backend
        # Serial on purpose: --parallel needs brianium/paratest (never
        # installed — this step had NEVER passed), and the suite shares one
        # test database. Same shape as `dev.sh test` locally.
        run: php artisan test --coverage-clover coverage.xml
        env:
          APP_ENV: testing

      - name: Upload coverage artifact
        # codecov needs an account token on private repos; the report as a
        # build artifact costs nothing and blocks nothing.
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Run security audit
        working-directory: backend
        run: composer audit

  lint:
    name: PHP Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr, phpcs

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Check PSR-12 code style
        working-directory: backend
        run: vendor/bin/phpcs --standard=PSR12 app/ --report=checkstyle | cs2pr
        continue-on-error: true
