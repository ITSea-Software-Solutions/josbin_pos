services:

  # ─────────────────────────────────────────────
  # PHP-FPM — Laravel 13 application
  # ─────────────────────────────────────────────
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: josbin_pos_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/josbin_pos.ini
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      APP_ENV: ${APP_ENV:-local}
    networks:
      - josbin_pos_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # Nginx — reverse proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: josbin_pos_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - josbin_pos_internal
    depends_on:
      - app

  # ─────────────────────────────────────────────
  # PostgreSQL 16 + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: josbin_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-josbin_pos}
      POSTGRES_USER: ${DB_USERNAME:-josbin_pos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: America/Paramaribo
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    networks:
      - josbin_pos_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-josbin_pos} -d ${DB_DATABASE:-josbin_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Redis 7 — queues, cache, sessions
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: josbin_pos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - ./docker/redis/data:/data
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    networks:
      - josbin_pos_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────
  # Laravel Reverb — native WebSocket server
  # ─────────────────────────────────────────────
  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: josbin_pos_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${REVERB_PORT:-6001}:8080"
    networks:
      - josbin_pos_internal
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Laravel Horizon — queue worker + monitoring
  # Supervised by supervisord inside the container
  # ─────────────────────────────────────────────
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: josbin_pos_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/josbin_pos.conf
    networks:
      - josbin_pos_internal
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Horizon is running if its status key exists in Redis (set by Horizon itself)
      test: ["CMD-SHELL", "php /var/www/html/artisan horizon:status 2>&1 | grep -qE 'running|paused' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # Laravel Scheduler — cron (exchange rate, AI summary, license check)
  # ─────────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: josbin_pos_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # Boot-time safety net: `rates:ensure-today` runs once before the
    # schedule loop, so a freshly-booted container never has the cashier
    # hitting "Voltooien" 30 seconds later and getting NO_DAILY_RATE. The
    # command is idempotent (no-op if today's rate is already locked) and
    # internally falls back to yesterday's rate when the API is unreachable
    # — see App\Services\DailyRateService. The same command is also on
    # routes/console.php at :30 + :00 as defence in depth.
    command: >
      sh -c "php artisan rates:ensure-today 2>&1 || true;
             while true; do php artisan schedule:run --verbose --no-interaction 2>&1; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
    networks:
      - josbin_pos_internal
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # PgBouncer — PostgreSQL connection pooling
  # Prevents connection exhaustion with 50+ stores × 10 terminals each
  # ─────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest  # 1.25.1 — bitnami tag 1.22.1 doesn't exist on docker.io
    container_name: josbin_pos_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_DATABASE:-josbin_pos}
      DB_USER: ${DB_USERNAME:-josbin_pos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE: md5
    ports:
      - "${PGBOUNCER_PORT:-5433}:5432"
    networks:
      - josbin_pos_internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${DB_USERNAME:-josbin_pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  josbin_pos_internal:
    driver: bridge
