; Production-only OPcache override (mounted by docker-compose.prod.yml as
; zz-opcache-prod.ini so it wins over the base php.ini).
;
; validate_timestamps=0 = never stat source files: every request runs fully
; from the opcode cache. Code changes therefore require an app-container
; restart — scripts/deploy-server.sh does exactly that after git pull.
; Local/demo stacks keep the base setting (1) so edits show up immediately.
opcache.validate_timestamps = 0
