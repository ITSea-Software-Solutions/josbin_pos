; Production-only PHP-FPM pool sizing (mounted by docker-compose.prod.yml as
; zz-prod.conf — later files override www.conf).
;
; The image default (pm.max_children = 5) caps the API at 5 concurrent PHP
; requests — a queue forms the moment several tills + the dashboard hit it
; together. 12 workers ≈ 700 MB peak PHP memory, comfortable on the droplet
; while it also hosts the other project.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
