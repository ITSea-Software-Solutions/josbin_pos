# ─── Rate limiting zones ───────────────────────────────────────────────────
# Defined at http block level; applied per location below.
# Zone sizes: 10m holds ~160,000 IP states.

# Login: max 5 req/minute per IP — brute force protection
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# General API: max 120 req/minute per IP (~2/sec) — reasonable POS usage
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

# Report export (PDF/CSV): max 10 req/minute — DomPDF is expensive
limit_req_zone $binary_remote_addr zone=export:10m rate=10r/m;

# Health check: max 60 req/minute — monitoring pings
limit_req_zone $binary_remote_addr zone=health:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Strict CSP — allows WebSocket connections (Reverb) and data URIs (receipt images)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none';" always;

    # HSTS — tell browsers to always use HTTPS (enforced by upstream proxy in production)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain application/json application/javascript text/css application/xml text/xml;
    gzip_min_length 1000;

    # ── Upload size (product images, CSV imports, .josbin_pos files) ─────────
    client_max_body_size 32M;

    # ── Static files — long cache, no PHP ─────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── OpenAPI docs — public, no auth ────────────────────────────────────
    location /api-docs/ {
        limit_req zone=api burst=20 nodelay;
        alias /var/www/html/public/api-docs/;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Health check — lightweight, monitored ─────────────────────────────
    location = /api/health {
        limit_req zone=health burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # ── Auth endpoints — strict rate limiting ─────────────────────────────
    location ~ ^/api/auth/(login|two-factor-challenge)$ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # ── Report export (PDF/CSV) — expensive, limited ──────────────────────
    location ~ ^/api/reports/.*(export|rekenkamer|pdf) {
        limit_req zone=export burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180;
        fastcgi_send_timeout 180;
    }

    # ── All other API routes ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # ── Root catch-all ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── PHP-FPM ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
        # Buffer responses — reduces time-to-first-byte on slow clients
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Horizon dashboard — internal network only ─────────────────────────
    location /horizon {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Telescope — dev only, blocked in production ───────────────────────
    location /telescope {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
