# Static docs site (VitePress manual + flows.html + architecture.html).
# No backend proxy — these are pure static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets — the SPA bundles drop ~70% on the wire, which is
    # the difference between 3s and instant on interior-Suriname connections.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;


    # VitePress emits clean URLs, e.g. /user_manual/04-making-a-sale maps to
    # 04-making-a-sale.html. Try the exact file, then .html, then a directory
    # index, then fall back to the site home.
    # Password-protected internal docs (continuity, pending points, audits).
    # Content comes from scripts/build-internal-docs.mjs — everything here is
    # srcExcluded from the public site and ONLY reachable through this gate.
    location /internal/ {
        alias /usr/share/nginx/internal/;
        index index.html;
        auth_basic "ITSea internal";
        auth_basic_user_file /etc/nginx/internal.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Installer downloads (POS .exe etc.). Persistent mount, NOT part of the
    # VitePress build — survives doc redeploys. Large binaries: force a
    # download rather than an inline render, and don't gzip (already
    # compressed). Directory listing on so the folder is browsable.
    # Visiting the folder shows the branded downloads PAGE. Without this the
    # autoindex listing itself inherited Content-Disposition: attachment
    # below and the browser downloaded the listing as a file.
    location = /downloads/ {
        # absolute_redirect off keeps the Location header relative — an
        # absolute one would drop the :8095 port and send the browser to
        # port 80 (a different site on this host).
        absolute_redirect off;
        return 302 /downloads.html;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex on;
        gzip off;
        add_header Content-Disposition "attachment" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
