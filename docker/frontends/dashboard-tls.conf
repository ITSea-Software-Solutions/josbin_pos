# HTTPS (self-signed) dashboard on :443 → published as :8443 on the host.
# Serves the SAME built dist as dashboard-web; exists so secure-context-only
# browser features (the camera barcode scanner on the product form) work in
# the demo. Same /api + /broadcasting same-origin proxy as the HTTP variant,
# plus a /app proxy so Laravel Reverb runs over wss on this TLS origin.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets — the SPA bundles drop ~70% on the wire, which is
    # the difference between 3s and instant on interior-Suriname connections.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;


    # API + broadcasting auth → Laravel backend (same origin → no CORS, TLS terminates here)
    location /api {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Public storage (product images, receipt logos, wallet QRs) lives on the
    # Laravel backend — proxy it same-origin so relative /storage URLs work.
    location /storage {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
    }

    location /broadcasting {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel Reverb WebSocket — terminates TLS here, forwards ws to reverb.
    # Echo connects to wss://<host>:8443/app/<key> when built with
    # VITE_REVERB_SCHEME=https + VITE_REVERB_PORT=8443.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
