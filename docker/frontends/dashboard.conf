server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + broadcasting auth proxied to the Laravel backend (same origin → no CORS)
    location /api {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Public storage (product images, receipt logos, wallet QRs) lives on the
    # Laravel backend — proxy it same-origin so relative /storage URLs work.
    location /storage {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
    }

    location /broadcasting {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
