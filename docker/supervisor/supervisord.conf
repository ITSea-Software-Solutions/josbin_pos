[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─── Laravel Horizon (queue manager) ───────────────────────────────────────
; Horizon manages all queue workers internally and restarts them on failure.
; We only need one Horizon process — it spawns workers based on horizon.php config.
[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/horizon_error.log
stderr_logfile_maxbytes=5MB
user=www-data
stopwaitsecs=3600
; Give Horizon time to finish current jobs before stopping (up to 1 hour)
; This ensures in-flight webhook dispatches and anomaly detection jobs complete

; ─── Laravel Reverb (WebSocket server) ────────────────────────────────────
; Reverb handles all WebSocket connections (live dashboard, POS product updates).
[program:reverb]
process_name=%(program_name)s
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/reverb_error.log
stderr_logfile_maxbytes=5MB
user=www-data

; ─── Laravel Scheduler (cron replacement) ──────────────────────────────────
; Runs `php artisan schedule:run` every 60 seconds.
; Handles: daily rate lock (06:00 AST), weekly AI summary (Mon 08:00 AST),
;          license check (daily), and any other scheduled commands.
[program:scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction 2>&1; sleep 60; done"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
user=www-data
